<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LumaFader — Settings Editor</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1c;
            --text-color: #f0f0f0;
            --border-color: #383838;
            --input-bg: #2b2b2b;
            --input-text: #ffffff;
            --save-btn-bg: #03dac6;
            --save-btn-hover: #018786;
        }

        body.page-1 { --accent-color: #ffffff; --accent-glow: rgba(255, 255, 255, 0.25); --bank-card-bg: #222222; --panel-bg: rgba(255, 255, 255, 0.04); }
        body.page-2 { --accent-color: #ff6b6b; --accent-glow: rgba(255, 107, 107, 0.3); --bank-card-bg: #261a1a; --panel-bg: rgba(255, 107, 107, 0.06); }
        body.page-3 { --accent-color: #ffe066; --accent-glow: rgba(255, 224, 102, 0.3); --bank-card-bg: #242216; --panel-bg: rgba(255, 224, 102, 0.06); }
        body.page-4 { --accent-color: #51cf66; --accent-glow: rgba(81, 207, 102, 0.3); --bank-card-bg: #18241b; --panel-bg: rgba(81, 207, 102, 0.06); }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1350px; margin-bottom: 15px; }
        h1 { letter-spacing: 3px; font-weight: 400; font-size: 22px; color: var(--accent-color); text-shadow: 0 0 15px var(--accent-glow); margin: 0; }
        .connection-panel { display: flex; align-items: center; gap: 15px; }
        #statusText { font-size: 13px; color: #aaa; font-weight: 600; }
        #connectBtn { background-color: #bb86fc; color: #121212; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        #connectBtn:hover { background-color: #9965f4; }
        #connectBtn.connected { background-color: #03dac6; }

        .page-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .page-tab { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 22px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease; }
        .page-tab:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .page-tab.active { background-color: var(--accent-color); color: #121212; border-color: var(--accent-color); font-weight: 700; box-shadow: 0 0 20px var(--accent-glow); }

        .container { width: 100%; max-width: 1350px; }
        .banks-grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .bank-card { background-color: var(--bank-card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .bank-header-title { font-size: 18px; font-weight: 700; color: var(--accent-color); margin-bottom: 12px; letter-spacing: 1.5px; text-align: center; text-shadow: 0 0 8px var(--accent-glow); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .hardware-layout { display: flex; gap: 15px; align-items: flex-start; }
        
        .buttons-panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 260px; }
        .section-label { font-size: 10px; color: #aaa; margin-bottom: 2px; font-weight: 700; }
        .button-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 5px 8px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.06); gap: 6px;}
        
        .faders-panel { flex-grow: 1; background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; }
        .faders-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .control-item { display: flex; flex-direction: column; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 6px 4px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.06); }
        .control-header { font-size: 12px; color: #ddd; margin-bottom: 4px; font-weight: 600; }
        .sub-label { font-size: 9px; color: #aaa; margin-bottom: 2px; font-weight: 600; text-align: center; }

        input[type="text"] { width: 32px; height: 26px; background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--input-text); text-align: center; font-size: 13px; font-weight: 700; border-radius: 5px; outline: none; transition: all 0.2s; }
        input[type="text"]:focus { border-color: var(--accent-color); background-color: #333333; }

        select { height: 30px; background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--input-text); font-size: 11px; font-weight: 700; border-radius: 5px; outline: none; transition: all 0.2s; cursor: pointer; text-align: center;}
        select:focus { border-color: var(--accent-color); background-color: #333333; }
        
        select[data-type="btn_type"] { width: 50px; appearance: none; }
        select[data-type="btn_cc"] { width: 85px; }
        
        .col-type { width: 50px; display: flex; flex-direction: column; align-items: center; }
        .col-num { width: 85px; display: flex; flex-direction: column; align-items: center; }
        .col-ch { width: 36px; display: flex; flex-direction: column; align-items: center; }

        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: 30px; margin-bottom: 40px; }
        .btn { padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-save { background-color: var(--save-btn-bg); color: #121212; }
        .btn-backup { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
    </style>
</head>
<body class="page-1">

    <div class="top-bar">
        <h1>LUMAFADER — EDITOR _ weifan ver.0806 </h1>
        <div class="connection-panel">
            <span id="statusText">Ready to connect...</span>
            <button id="connectBtn">🔌 CONNECT DEVICE</button>
        </div>
    </div>

    <div class="page-tabs" id="pageTabs"></div>
    <div class="container">
        <div class="banks-grid-2x2" id="banksContainer"></div>
        <div class="action-bar">
            <button id="saveBtn" class="btn btn-save" disabled>💾 SAVE TO HARDWARE</button>
            <button id="backupBtn" class="btn btn-backup" disabled>⬇ DOWNLOAD PC BACKUP</button>
        </div>
    </div>

    <script>
        let port;
        let writer;
        let currentSettings = null;
        let currentPage = 1;
        let isConnected = false;

        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        let noteOptionsHtml = '<option value="">--</option>';
        for(let i = 0; i <= 127; i++) {
            let name = noteNames[i % 12] + (Math.floor(i / 12) - 2);
            noteOptionsHtml += `<option value="${i}">${i} (${name})</option>`;
        }

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const saveBtn = document.getElementById('saveBtn');
        const backupBtn = document.getElementById('backupBtn');

        connectBtn.addEventListener('click', async () => {
            try {
                if (isConnected && writer) {
                    statusText.innerText = "Requesting data...";
                    await writer.write("\n\nCMD:GET_SETTINGS\n");
                    return;
                }

                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                statusText.innerText = "Connected, reading...";
                connectBtn.innerText = "🔄 RELOAD DATA";
                connectBtn.classList.add("connected");
                isConnected = true;

                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                readLoop();

                setTimeout(async () => {
                    await writer.write("\n\nCMD:GET_SETTINGS\n");
                }, 200);

            } catch (err) {
                statusText.innerText = err.message.includes('already open') ? 
                    "⚠️ Port in use! Please restart Chrome completely." : "Connection failed: " + err.message;
            }
        });

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();
            let buffer = "";

            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += value;
                    if (buffer.includes("\n")) {
                        const lines = buffer.split("\n");
                        buffer = lines.pop(); 
                        
                        for (const line of lines) {
                            if (line.trim() === "") continue;
                            const rspIndex = line.indexOf("RSP:");
                            
                            if (rspIndex !== -1) {
                                const jsonStr = line.substring(rspIndex + 4).trim();
                                try {
                                    const data = JSON.parse(jsonStr);
                                    
                                    if (data.status === "ok") {
                                        statusText.innerText = "🟢 Write successful! Replug the USB adapter.";
                                        saveBtn.innerText = "💾 SAVE TO HARDWARE";
                                        saveBtn.disabled = false;
                                    } else if (data.error) {
                                        statusText.innerText = "❌ Hardware Error: " + data.error;
                                        saveBtn.disabled = false;
                                    } else if (data.PAGE_1_BANKS) {
                                        currentSettings = data;
                                        statusText.innerText = "🟢 Data Synchronized";
                                        saveBtn.disabled = false;
                                        backupBtn.disabled = false;
                                        renderPage();
                                    }
                                } catch (e) {
                                    console.error("Parse failed:", jsonStr);
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                statusText.innerText = "Connection lost.";
                isConnected = false;
            } finally {
                reader.releaseLock();
            }
        }
        
        function setPage(pageNum) {
            currentPage = pageNum;
            renderPage();
        }

        function updateData(inputElem) {
            if (!currentSettings) return;
            const bank = parseInt(inputElem.dataset.bank);
            const type = inputElem.dataset.type;
            const idx = parseInt(inputElem.dataset.idx);
            let val = inputElem.value;
            
            if (inputElem.tagName === 'INPUT') val = val.trim();

            if (val !== "" && inputElem.tagName === 'INPUT') {
                val = parseInt(val, 10);
                if (isNaN(val)) val = "";
            }

            const p = currentPage;
            let needsRender = false;
            
            if (type === 'btn_type') {
                if (!Array.isArray(currentSettings[`PAGE_${p}_BUTTON_TYPES`])) {
                    currentSettings[`PAGE_${p}_BUTTON_TYPES`] = [['CC','CC','CC','CC'],['CC','CC','CC','CC'],['CC','CC','CC','CC'],['CC','CC','CC','CC']];
                }
                currentSettings[`PAGE_${p}_BUTTON_TYPES`][bank][idx] = val;
                
                // Clear value to prevent type conflict
                currentSettings[`PAGE_${p}_BUTTONS`][bank][idx] = '';
                needsRender = true;
            }
            if (type === 'btn_ch') {
                if (!Array.isArray(currentSettings[`PAGE_${p}_BUTTON_CHANNELS`])) {
                    currentSettings[`PAGE_${p}_BUTTON_CHANNELS`] = [['','','',''],['','','',''],['','','',''],['','','','']];
                }
                currentSettings[`PAGE_${p}_BUTTON_CHANNELS`][bank][idx] = val;
            }
            if (type === 'fader_ch') {
                if (!Array.isArray(currentSettings[`PAGE_${p}_BANK_SLIDER_CHANNELS`])) {
                    currentSettings[`PAGE_${p}_BANK_SLIDER_CHANNELS`]= [['','','',''],['','','',''],['','','',''],['','','','']];
                }
                currentSettings[`PAGE_${p}_BANK_SLIDER_CHANNELS`][bank][idx] = val;
            }
            if (type === 'btn_cc') {
                currentSettings[`PAGE_${p}_BUTTONS`][bank][idx] = (val === "") ? "" : parseInt(val);
            }
            if (type === 'fader_cc') {
                currentSettings[`PAGE_${p}_BANKS`][bank][idx] = val;
            }
            
            if(needsRender) renderPage();
        }

        function renderPage() {
            document.body.className = `page-${currentPage}`;
            let tabsHtml = '';
            for(let i=1; i<=4; i++) {
                tabsHtml += `<div class="page-tab ${currentPage === i ? 'active' : ''}" onclick="setPage(${i})">PAGE ${i}</div>`;
            }
            document.getElementById('pageTabs').innerHTML = tabsHtml;

            const container = document.getElementById('banksContainer');
            if (!currentSettings) {
                container.innerHTML = `<div style="text-align:center; grid-column: span 2; padding: 50px; color:#666;">Click 'CONNECT DEVICE' above to load settings.</div>`;
                return;
            }

            const p = currentPage;
            const banks = currentSettings[`PAGE_${p}_BANKS`];
            const slider_chs = currentSettings[`PAGE_${p}_BANK_SLIDER_CHANNELS`];
            const buttons = currentSettings[`PAGE_${p}_BUTTONS`];
            const button_chs = currentSettings[`PAGE_${p}_BUTTON_CHANNELS`];
            const button_types = currentSettings[`PAGE_${p}_BUTTON_TYPES`] || [['CC','CC','CC','CC'],['CC','CC','CC','CC'],['CC','CC','CC','CC'],['CC','CC','CC','CC']];
            const labelsFader = ['A', 'B', 'C', 'D'];

            let html = '';
            for(let b=0; b<4; b++) {
                html += `
                <div class="bank-card">
                    <div class="bank-header-title">Bank ${b + 1}</div>
                    <div class="hardware-layout">
                        <div class="buttons-panel">
                            <div class="section-label">BUTTONS</div>`;
                
                [3, 2, 1, 0].forEach(btn_idx => {
                    const btn_cc = (buttons[b] && buttons[b][btn_idx] !== undefined && buttons[b][btn_idx] !== '') ? buttons[b][btn_idx] : '';
                    const btn_ch = (button_chs[b] && button_chs[b][btn_idx] !== undefined) ? button_chs[b][btn_idx] : '';
                    const btn_type = (button_types[b] && button_types[b][btn_idx] !== undefined) ? button_types[b][btn_idx] : 'CC';
                    
                    let controlAreaHtml = '';
                    if(btn_type === 'Note') {
                        let dynamicOptions = noteOptionsHtml;
                        if(btn_cc !== '') {
                            dynamicOptions = dynamicOptions.replace(`value="${btn_cc}"`, `value="${btn_cc}" selected`);
                        }
                        controlAreaHtml = `<div class="col-num"><div class="sub-label">NOTE</div>
                                           <select data-bank="${b}" data-type="btn_cc" data-idx="${btn_idx}" onchange="updateData(this)">
                                              ${dynamicOptions}
                                           </select></div>`;
                    } else {
                        controlAreaHtml = `<div class="col-num"><div class="sub-label">NUM</div><input type="text" data-bank="${b}" data-type="btn_cc" data-idx="${btn_idx}" value="${btn_cc}" onchange="updateData(this)"></div>`;
                    }

                    html += `
                            <div class="button-row">
                                <div style="font-size: 11px; font-weight: 600; color: #ddd; width: 32px;">Btn ${btn_idx + 1}</div>
                                <div style="display: flex; gap: 4px;">
                                    <div class="col-type">
                                        <div class="sub-label">TYPE</div>
                                        <select data-bank="${b}" data-type="btn_type" data-idx="${btn_idx}" onchange="updateData(this)">
                                            <option value="CC" ${btn_type === 'CC' ? 'selected' : ''}>CC</option>
                                            <option value="Note" ${btn_type === 'Note' ? 'selected' : ''}>Note</option>
                                        </select>
                                    </div>
                                    ${controlAreaHtml}
                                    <div class="col-ch"><div class="sub-label">CH</div><input type="text" data-bank="${b}" data-type="btn_ch" data-idx="${btn_idx}" value="${btn_ch}" onchange="updateData(this)"></div>
                                </div>
                            </div>`;
                });

                html += `</div><div class="faders-panel"><div class="section-label" style="margin-bottom: 6px;">FADERS (A-D)</div><div class="faders-grid">`;
                
                for(let s=0; s<4; s++) {
                    const slider_cc = (banks[b] && banks[b][s] !== undefined) ? banks[b][s] : '';
                    const slider_ch_val = (slider_chs[b] && slider_chs[b][s] !== undefined) ? slider_chs[b][s] : '';
                    html += `
                                <div class="control-item">
                                    <div class="control-header">${labelsFader[s]}</div>
                                    <div class="sub-label">CC</div><input type="text" data-bank="${b}" data-type="fader_cc" data-idx="${s}" value="${slider_cc}" onchange="updateData(this)">
                                    <div class="sub-label" style="margin-top: 4px;">CH</div><input type="text" data-bank="${b}" data-type="fader_ch" data-idx="${s}" value="${slider_ch_val}" onchange="updateData(this)">
                                </div>`;
                }
                html += `</div></div></div></div>`;
            }
            container.innerHTML = html;
        }
        
        saveBtn.addEventListener('click', async () => {
            if (!writer || !currentSettings) return;
            if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
            
            saveBtn.innerText = "⏳ SAVING...";
            saveBtn.disabled = true;
            statusText.innerText = "Transferring data. Do not unplug...";

            const jsonStr = JSON.stringify(currentSettings);
            const fullCmd = `\nCMD:SET_SETTINGS|${jsonStr}\n`;
            
            const chunkSize = 32;
            for (let i = 0; i < fullCmd.length; i += chunkSize) {
                const chunk = fullCmd.substring(i, i + chunkSize);
                await writer.write(chunk);
                await new Promise(r => setTimeout(r, 25)); 
            }
        });

        backupBtn.addEventListener('click', () => {
            if (!currentSettings) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentSettings, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "lumafader_settings_backup.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        renderPage();
    </script>
</body>
</html>
